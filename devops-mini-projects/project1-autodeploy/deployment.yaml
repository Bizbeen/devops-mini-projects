apiVersion: apps/v1
kind: Deployment
metadata:
  name: autodeploy-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: autodeploy-app
  template:
    metadata:
      labels:
        app: autodeploy-app
    spec:
      containers:
        - name: autodeploy-app
          image: tulasistr/autodeploy-app:v1
          ports:
            - containerPort: 5000

---
apiVersion: v1
kind: Service
metadata:
  name: autodeploy-service
spec:
  selector:
    app: autodeploy-app
  type: NodePort
  ports:
    - port: 5000
      targetPort: 5000
